version: '3.8'

services:
  vulnerable-app:
    build: .
    container_name: xss-rce-challenge
    ports:
      - "5000:5000"
    volumes:
      # VULNERABILITY: Docker socket exposed (container escape vector)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    restart: unless-stopped
    networks:
      - challenge-net

networks:
  challenge-net:
    driver: bridge
